name: Prospective Taiwan PIT capture (unattested)

on:
  schedule:
    # 19:17 Asia/Taipei, daily; GitHub schedule is best-effort, not an SLA.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospective-taiwan-pit-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified operators
        uses: actions/checkout@v4
      - name: Checkout append-only audit branch
        uses: actions/checkout@v4
        with:
          ref: pit-capture
          path: pit-archive
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install operators
        run: pip install -e .
      - name: Capture official TWSE feed and audit outcome
        id: twse_poll
        shell: bash
        run: |
          set +e
          python -m tradingagents_tw.truth.capture_operator --archive-root pit-archive/data/pit
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture official TPEx feed and audit outcome
        id: tpex_poll
        shell: bash
        run: |
          set +e
          python -m tradingagents_tw.truth.tpex_capture_operator --archive-root pit-archive/data/pit
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist immutable receipts on isolated branch
        working-directory: pit-archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Either source can fail before producing a feed observation; stage only
          # the bounded audit root so ERROR poll receipts are never hidden.
          git add -A -- data/pit
          if ! git diff --cached --quiet; then
            git commit -m "evidence: append prospective Taiwan poll receipts"
            git push origin HEAD:pit-capture
          fi
      - name: Surface failed observations after audit persistence
        if: steps.twse_poll.outputs.exit_code != '0' || steps.tpex_poll.outputs.exit_code != '0'
        run: exit 1
