# Pages source enabled in repository settings; this file change triggers the first deployment after enablement.
name: Deploy mobile dashboard (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate read-only dashboard
        run: node --test web/dashboard.test.mjs
      - name: Stage only audited static client files
        run: |
          mkdir -p _site
          cp web/index.html web/dashboard.mjs _site/
          test -s _site/index.html
          test -s _site/dashboard.mjs
          test ! -e _site/projection.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
